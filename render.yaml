services:
  - type: web
    name: subscriptiq-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://frontend-eta-murex-51.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
